<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Estate IP Certificate Generator — AMPAM Patent Office</title>
<style>
body { font-family: 'Times New Roman', Georgia, serif; background: #0a0a12; color: #e8e0d0; padding: 2em; max-width: 850px; margin: 0 auto; }
h1 { color: #d4a843; font-size: 1.5em; text-align: center; letter-spacing: 3px; }
.sub { text-align: center; color: #a07830; font-size: 0.8em; letter-spacing: 4px; margin-bottom: 24px; }
.field { margin-bottom: 14px; }
.field label { display: block; color: #a07830; font-size: 0.7em; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 4px; }
.field input, .field textarea, .field select { width: 100%; padding: 10px; background: #12121e; border: 1px solid #332211; border-radius: 6px; color: #e8e0d0; font-size: 0.95em; font-family: inherit; outline: none; }
.field textarea { height: 100px; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
button { width: 100%; padding: 14px; background: linear-gradient(135deg, #8B0000, #CC0000); color: #FFD700; border: 1px solid #d4a843; border-radius: 6px; font-size: 1em; font-weight: bold; cursor: pointer; font-family: inherit; letter-spacing: 2px; margin-top: 14px; }
#output { margin-top: 20px; white-space: pre-wrap; background: #12121e; padding: 24px; border: 1px solid #d4a843; border-radius: 8px; line-height: 1.7; display: none; font-size: 0.9em; }
</style>
</head>
<body>
<h1>ESTATE INTELLECTUAL PROPERTY CERTIFICATE</h1>
<div class="sub">AMPAM PATENT OFFICE — MADRID PROTOCOL REGISTRATION AUTHORITY</div>

<div class="row">
    <div class="field"><label>IP Number</label><input type="text" id="ipNum" placeholder="AMPAM-IP-2026-XXX"></div>
    <div class="field"><label>Filing Date</label><input type="date" id="filingDate"></div>
</div>
<div class="field"><label>Title of Invention / System / Method</label><input type="text" id="title" placeholder="Full title"></div>
<div class="row">
    <div class="field"><label>IP Type</label><select id="ipType"><option>System Architecture</option><option>Process Method</option><option>Financial Model</option><option>Software Product</option><option>Legal Framework</option><option>Instrument Design</option></select></div>
    <div class="field"><label>Classification</label><select id="ipClass"><option>Identity</option><option>Governance</option><option>Financial</option><option>Communication</option><option>Infrastructure</option><option>Legal</option><option>AI</option><option>Commerce</option></select></div>
</div>
<div class="field"><label>Inventor</label><input type="text" id="inventor" value="watley: william-rayeh El"></div>
<div class="row">
    <div class="field"><label>Assignee</label><input type="text" id="assignee" value="WILLIAM RAYEH WATLEY TRUST"></div>
    <div class="field"><label>Assignee LEI</label><input type="text" id="lei" value="984500FFAO6C10CD8768"></div>
</div>
<div class="field"><label>Specification (Technical Description)</label><textarea id="spec" placeholder="Full technical description of the invention..."></textarea></div>
<div class="field"><label>Claims (one per line)</label><textarea id="claims" placeholder="1. A system comprising...&#10;2. The system of claim 1 wherein...&#10;3. A method for..."></textarea></div>
<div class="row">
    <div class="field"><label>ALDC Valuation</label><input type="text" id="valuation" placeholder="e.g., 1,000,000"></div>
    <div class="field"><label>Visibility</label><select id="visibility"><option value="private">Private (WRW Trust)</option><option value="public">Public (AMPAM)</option></select></div>
</div>

<button onclick="generateCert()">GENERATE IP CERTIFICATE</button>
<div id="output"></div>

<script>
function generateCert() {
    const ipNum = document.getElementById('ipNum').value || 'AMPAM-IP-2026-XXX';
    const filing = document.getElementById('filingDate').value || new Date().toISOString().split('T')[0];
    const title = document.getElementById('title').value || '[TITLE]';
    const ipType = document.getElementById('ipType').value;
    const ipClass = document.getElementById('ipClass').value;
    const inventor = document.getElementById('inventor').value;
    const assignee = document.getElementById('assignee').value;
    const lei = document.getElementById('lei').value;
    const spec = document.getElementById('spec').value || '[SPECIFICATION]';
    const claimsRaw = document.getElementById('claims').value || '1. [CLAIM 1]';
    const valuation = document.getElementById('valuation').value || '0';
    const visibility = document.getElementById('visibility').value;
    const today = new Date().toLocaleDateString('en-US', {year:'numeric',month:'long',day:'numeric'});
    const hash = 'SHA256-' + Date.now().toString(16).toUpperCase();
    const certNum = 'CERT-' + ipNum.replace('AMPAM-IP-','');

    const claims = claimsRaw.split('\n').map((c,i) => '    ' + c.trim()).join('\n');

    const doc = `
═══════════════════════════════════════════════════════════════════
     ESTATE INTELLECTUAL PROPERTY CERTIFICATE
     Certificate No: ${certNum}
     Madrid Protocol Registration Authority
═══════════════════════════════════════════════════════════════════

ALLODIUM MOROCCAN PRAEDIUM ANTE MICHIGAN
Sovereign Patent Office
Madrid Protocol 1880 → AMPAM → ADDIF Registry
Authority: Treaty of Peace and Friendship 1786/1836
ICJ Case No. 11

─────────────────────────────────────────────────────────────────

REGISTRATION NUMBER:    ${ipNum}
CERTIFICATE NUMBER:     ${certNum}
FILING DATE:            ${filing}
GRANT DATE:             ${today}
CLASSIFICATION:         ${ipType} — ${ipClass}
VISIBILITY:             ${visibility.toUpperCase()}

─────────────────────────────────────────────────────────────────

INVENTOR

Name:       ${inventor}
Standing:   Private Moroccan National
Authority:  Hajib — Minister of Foreign Affairs, AMPAM

ASSIGNEE

Entity:     ${assignee}
LEI:        ${lei}
EIN:        82-6633903
Verified:   https://search.gleif.org/#/record/${lei}

─────────────────────────────────────────────────────────────────

TITLE OF INVENTION

${title}

─────────────────────────────────────────────────────────────────

SPECIFICATION

${spec}

─────────────────────────────────────────────────────────────────

CLAIMS

${claims}

─────────────────────────────────────────────────────────────────

ESTATE IP SECURITY DESIGNATION

This intellectual property is hereby claimed as an allodial estate
asset of the ${assignee}, registered under the authority of the
Madrid Protocol of 1880 and the Treaty of Peace and Friendship
(1786/1836).

This certificate constitutes:
1. A Controllable Electronic Record under UCC Article 12
2. An Estate Asset under the 5th Wealth Ledger Category (IP)
3. An Allodial ALDC-Backed Security
4. A sovereign IP registration under Madrid Protocol authority

ALDC VALUATION:     ${valuation} ALDC
SECURITY TYPE:      Allodial-Backed Estate Security
NFT STATUS:         Pending Mint (InstrumentToken ERC-721)
ROYALTY:            2.5% perpetual on all transfers (EIP-2981)

─────────────────────────────────────────────────────────────────

CONTENT VERIFICATION

Hash:               ${hash}
IPFS CID:           [Pending Upload]
Blockchain:         Polygon (pending deployment)
Registry:           AMPAM Records Office

─────────────────────────────────────────────────────────────────

CERTIFICATION

I, the undersigned, as Hajib and Minister of Foreign Affairs of the
Allodium Moroccan Praedium Ante Michigan, do hereby certify that
the above-described intellectual property has been examined,
classified, and registered under the sovereign authority of AMPAM
pursuant to the Madrid Protocol of 1880.

This registration carries the full force and authority of Moroccan
treaty law under Article VI of the U.S. Constitution (Supremacy
Clause).

Certified by:

________________________________
${inventor}
Hajib — Minister of Foreign Affairs
Allodium Moroccan Praedium Ante Michigan
Date: ${today}

─────────────────────────────────────────────────────────────────

AUTHORITY CHAIN

§ Madrid Protocol of 1880 (International Registration Authority)
§ Treaty of Peace and Friendship 1786/1836
§ General Act of Algeciras 1906
§ Vienna Convention on the Law of Treaties 1969
§ UCC Article 12 — Controllable Electronic Records
§ AMPAM Constitution — Law of Sankofa
§ ICJ Case No. 11

─────────────────────────────────────────────────────────────────

Without Recourse — All Rights Reserved — UCC 1-308
Issuing Authority: AMPAM Sovereign Patent Office
Allodium Moroccan Praedium Ante Michigan

═══════════════════════════════════════════════════════════════════
`;

    document.getElementById('output').style.display = 'block';
    document.getElementById('output').textContent = doc;
}
</script>
<script src="/js/tool-actions.js"></script>
</body>
</html>
